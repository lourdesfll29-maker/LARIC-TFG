<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LARIC system architecture">
  <title>LARIC system architecture</title>
  <desc>User to PyQt5 HMI (laric_interface.py); HMI to agent (agent_logic.py) via /from_human and /emergency_stop, agent to HMI via /robot_feedback; agent to six LangChain tools to Nav2 action servers (/spin, /drive_on_heading, /backup, /navigate_to_pose) to the robot (TurtleBot3 in Gazebo or the real Husarion ROSbot 3).</desc>
  <style>
    .bg     { fill:#ffffff; stroke:#e5e7eb; stroke-width:1; }
    .blue   { fill:#e8f0fe; stroke:#4285f4; stroke-width:1.5; }
    .teal   { fill:#e6f4f1; stroke:#0d9488; stroke-width:1.5; }
    .title  { font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; font-weight:600; fill:#1f2937; }
    .head   { font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; font-weight:600; fill:#111827; }
    .sub    { font-family:'Segoe UI',system-ui,sans-serif; font-size:11.5px; fill:#6b7280; }
    .label  { font-family:'Segoe UI',system-ui,sans-serif; font-size:11px; fill:#6b7280; }
    .conn   { stroke:#9ca3af; stroke-width:2; fill:none; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="678" height="558" rx="14"/>
  <text class="head" x="340" y="28" text-anchor="middle">LARIC system architecture</text>

  <!-- connectors -->
  <line class="conn" x1="150" y1="90"  x2="150" y2="137" marker-end="url(#arr)"/>
  <line class="conn" x1="245" y1="156" x2="405" y2="156" marker-end="url(#arr)"/>
  <line class="conn" x1="405" y1="176" x2="245" y2="176" marker-end="url(#arr)"/>
  <line class="conn" x1="500" y1="186" x2="500" y2="239" marker-end="url(#arr)"/>
  <line class="conn" x1="500" y1="288" x2="500" y2="341" marker-end="url(#arr)"/>
  <line class="conn" x1="500" y1="402" x2="500" y2="443" marker-end="url(#arr)"/>
  <text class="label" x="325" y="149" text-anchor="middle">/from_human &#183; /emergency_stop</text>
  <text class="label" x="325" y="190" text-anchor="middle">/robot_feedback</text>

  <!-- User -->
  <rect class="blue" x="55" y="44" width="190" height="46" rx="10"/>
  <text class="title" x="150" y="67" text-anchor="middle">User</text>
  <text class="sub"   x="150" y="82" text-anchor="middle">voice / text</text>

  <!-- HMI -->
  <rect class="blue" x="55" y="138" width="190" height="48" rx="10"/>
  <text class="title" x="150" y="160" text-anchor="middle">laric_interface.py</text>
  <text class="sub"   x="150" y="175" text-anchor="middle">PyQt5 HMI + STT</text>

  <!-- Agent -->
  <rect class="blue" x="405" y="138" width="190" height="48" rx="10"/>
  <text class="title" x="500" y="160" text-anchor="middle">agent_logic.py</text>
  <text class="sub"   x="500" y="175" text-anchor="middle">LangChain + LLM</text>

  <!-- Tools -->
  <rect class="blue" x="405" y="240" width="190" height="48" rx="10"/>
  <text class="title" x="500" y="262" text-anchor="middle">Custom tools (&#215;6)</text>
  <text class="sub"   x="500" y="277" text-anchor="middle">LangChain tool calls</text>

  <!-- Nav2 -->
  <rect class="teal" x="360" y="342" width="280" height="60" rx="10"/>
  <text class="title" x="500" y="364" text-anchor="middle">Nav2 action servers</text>
  <text class="sub"   x="500" y="381" text-anchor="middle">/spin &#183; /drive_on_heading</text>
  <text class="sub"   x="500" y="395" text-anchor="middle">/backup &#183; /navigate_to_pose</text>

  <!-- Robot -->
  <rect class="teal" x="360" y="444" width="280" height="62" rx="10"/>
  <text class="title" x="500" y="466" text-anchor="middle">Robot</text>
  <text class="sub"   x="500" y="483" text-anchor="middle">TurtleBot3 (Gazebo)</text>
  <text class="sub"   x="500" y="498" text-anchor="middle">Husarion ROSbot 3 (real)</text>

  <!-- legend -->
  <rect class="blue" x="175" y="528" width="12" height="12" rx="3"/>
  <text class="label" x="193" y="538">language / AI layer</text>
  <rect class="teal" x="360" y="528" width="12" height="12" rx="3"/>
  <text class="label" x="378" y="538">Nav2 + robot execution</text>
</svg>
